<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield - Security Operations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-shield-alt"></i>
                <h1>CyberShield</h1>
                <p>Security Operations Platform</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>

                <div class="form-divider">
                    <span>OR</span>
                </div>

                <button type="button" class="btn btn-secondary btn-block" id="toggleRegister">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="registerForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input 
                        type="text" 
                        id="reg-username" 
                        name="username" 
                        placeholder="Choose a username" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input 
                        type="email" 
                        id="reg-email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reg-fullname">Full Name</label>
                    <input 
                        type="text" 
                        id="reg-fullname" 
                        name="full_name" 
                        placeholder="Enter your full name" 
                    >
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input 
                        type="password" 
                        id="reg-password" 
                        name="password" 
                        placeholder="Create a password" 
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-user-check"></i> Register
                </button>

                <button type="button" class="btn btn-secondary btn-block" id="toggleLogin">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </button>
            </form>

            <div id="messageArea" class="message-area"></div>
        </div>

        <div class="auth-footer">
            <p>© 2026 CyberShield. All rights reserved.</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
